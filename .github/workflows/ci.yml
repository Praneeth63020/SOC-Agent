name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOC_LLM_PROVIDER: mock        # CI never calls a real LLM and needs no key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Environment check (builds the locked-down Hermes agents offline)
        run: python -m soc_agent check
      - name: Tests (offline, mock LLM only) with coverage and junit
        run: |
          mkdir -p reports
          pytest --cov --cov-report=term --cov-report=json:reports/coverage.json --junitxml=reports/junit.xml
      - name: Scenario matrix end to end (mock LLM through real Hermes)
        run: python scripts/run_scenarios.py
      - name: Verify the scenario database's audit trail
        run: SOC_DB_PATH=state/scenarios-mock.db python -m soc_agent verify-audit
      - name: End-to-end demo (fresh DB, approval gate, simulated execution, close, verify-audit)
        run: scripts/demo.sh --mock
      - name: Test report
        if: always()
        run: python scripts/make_test_report.py --out reports/test-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-and-reports
          path: |
            reports/
            runs/
            state/
