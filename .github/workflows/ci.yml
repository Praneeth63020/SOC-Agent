name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOC_LLM_PROVIDER: mock        # CI never calls a real LLM and needs no key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Tests (offline, mock LLM only)
        run: pytest --cov --cov-report=term --junitxml=reports/junit.xml
      - name: Day 1 demo (mock LLM through real Hermes)
        run: |
          python -m soc_agent check
          python -m soc_agent plan data/alerts/account_compromise.json --provider mock
          python -m soc_agent plan data/alerts/account_compromise.json --provider mock --scenario escape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-run-records
          path: |
            reports/
            runs/
